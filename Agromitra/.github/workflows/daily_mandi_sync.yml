name: Automated Daily Mandi Price Sync

on:
  schedule:
    # Runs every day at 01:30 UTC (07:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Mandi Price Sync
        run: node scripts/sync_mandi_prices.js
